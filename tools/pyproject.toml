[project]
name = "limtool"
version = "0.1.0"
description = "Deterministic project tooling for the AI harness"
readme = "README.md"
authors = [
    { name = "Florian-David Lange", email = "florian-david.lange@smartlab-solutions.de" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
limtool = "limtool:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
