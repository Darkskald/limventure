# yaml-language-server: $schema=../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: container
description: >
  One stream per physical container (ADR-0017). Holds at most one sample at a time, with a
  remaining quantity. The state also folds the free-standing `aliquoted` and `pooled`
  events the DCBs write to this container's subject (ADR-0022). `disposed` ends the
  lifecycle (ESDM-009). Uniqueness of the external barcode per tenant spans all containers
  and is an open point of ADR-0022 - not enforced by this aggregate.
scope:
  domain: lims
  boundedContext: sample-management
identifiedBy:
  source: state
  field: containerId
state:
  type: object
  properties:
    containerId: { type: string }
    label: { type: string }
    externalBarcode: { type: string }
    disposed: { type: boolean }
    sampleId: { type: string }
    quantity: { type: number, minimum: 0 }
    unit: { type: string }
    locationId: { type: string }
    parentContainerId: { type: string }
  required: [containerId, label, disposed]
invariants:
  - name: label-new-container-only
    rule: A container is labelled exactly once, as the first event of its stream.
  - name: labelled-container-only
    rule: Every command except `label` requires a labelled container.
  - name: not-disposed
    rule: A disposed container cannot be relabelled, filled, withdrawn from, emptied, moved, placed or disposed again.
  - name: fill-empty-only
    rule: A container can only be filled while it holds no sample.
  - name: content-required
    rule: Withdrawing from or emptying a container requires that it holds a sample.
  - name: withdraw-within-quantity
    rule: >
      A withdrawal must name the sample the container holds, use the container's unit and
      not exceed the remaining quantity. Withdrawing everything leaves the container holding
      the sample with quantity zero until it is emptied.
  - name: not-into-itself
    rule: A container cannot be placed into itself.
---
# yaml-language-server: $schema=../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: label
scope: { domain: lims, boundedContext: sample-management, aggregate: container }
data:
  type: object
  properties:
    containerId: { type: string }
    label: { type: string }
    containerType: { type: string, description: Tenant-configured type, e.g. vial-10ml, plate-96. }
    externalBarcode: { type: string }
  required: [containerId, label, containerType]
publishes: [labelled]
actors: [sample-receptionist, analyst]
---
