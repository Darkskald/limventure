  Puts a sample into an empty container, typically at receipt. Transfers between
  containers are aliquoting or pooling, not fill.
data:
  type: object
  properties:
    containerId: { type: string }
    sampleId: { type: string }
    quantity: { type: number, exclusiveMinimum: 0 }
    unit: { type: string }
  required: [containerId, sampleId, quantity, unit]
publishes: [filled]
actors: [sample-receptionist]
