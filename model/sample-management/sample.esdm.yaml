# yaml-language-server: $schema=../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: aggregate
name: sample
description: >
  One stream per sample. Starts with `expected`, with `received` (unannounced sample), or
  with the free-standing `aliquoted` / `pooled` written by the aliquoting and pooling DCBs
  (ADR-0022); the state folds those too. `disposed` ends the lifecycle; corrections stay
  possible as new events (ESDM-009 - no declarative terminal event yet).
scope:
  domain: lims
  boundedContext: sample-management
identifiedBy:
  source: state
  field: sampleId
state:
  type: object
  properties:
    sampleId: { type: string }
    status:
      type: string
      enum: [expected, cancelled, received, disposed]
    overdue: { type: boolean }
    expectedBy: { type: string, format: date-time }
    parentSampleIds:
      type: array
      items: { type: string }
  required: [sampleId, status]
invariants:
  - name: expect-new-sample-only
    rule: A sample can only be expected as the first event of its stream.
  - name: receive-once
    rule: A sample that has been received cannot be received again.
  - name: cancel-open-expectation-only
    rule: >
      An expectation can only be cancelled while the sample is expected, i.e. neither
      received nor cancelled.
  - name: overdue-open-expectation-only
    rule: >
      A sample can only be marked overdue while it is expected and not yet marked overdue.
  - name: dispose-present-sample-only
    rule: >
      Only a sample that is physically present (received, aliquoted or pooled) and not yet
      disposed can be disposed.
---
# yaml-language-server: $schema=../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: expect
scope: { domain: lims, boundedContext: sample-management, aggregate: sample }
data:
  type: object
  properties:
    sampleId: { type: string }
    orderId: { type: string }
    lotId: { type: string }
    matrix: { type: string }
    samplingPoint: { type: string }
    expectedBy: { type: string, format: date-time }
    deadlineSource:
      type: string
      description: Where the deadline comes from (specification, contract SLA, profile) and its version.
  required: [sampleId, matrix, expectedBy, deadlineSource]
publishes: [expected]
actors: [requester, inspection-plan]
---
# yaml-language-server: $schema=../schemas/core/v1.yaml
