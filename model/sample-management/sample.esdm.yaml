# yaml-language-server: $schema=../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: received
scope: { domain: lims, boundedContext: sample-management, aggregate: sample }
description: >
  Fulfils an open expectation (flagged late when `overdue` preceded it) or starts the
  stream of an unannounced sample.
data:
  type: object
  properties:
    sampleId: { type: string }
    orderId: { type: string }
    lotId: { type: string }
    matrix: { type: string }
    samplingPoint: { type: string }
    takenAt: { type: string, format: date-time }
    takenBy: { type: string }
    late: { type: boolean }
  required: [sampleId, late]
metadata:
  annotations:
    cloudevents.type: io.limventure.sample-management.sample-received
