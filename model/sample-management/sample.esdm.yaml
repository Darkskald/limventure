kind: event
name: expected
scope: { domain: lims, boundedContext: sample-management, aggregate: sample }
data:
  type: object
  properties:
    sampleId: { type: string }
    orderId: { type: string }
    lotId: { type: string }
    matrix: { type: string }
    samplingPoint: { type: string }
    expectedBy: { type: string, format: date-time }
    deadlineSource: { type: string }
  required: [sampleId, matrix, expectedBy, deadlineSource]
metadata:
  annotations:
    cloudevents.type: io.limventure.sample-management.sample-expected
---
# yaml-language-server: $schema=../schemas/core/v1.yaml
